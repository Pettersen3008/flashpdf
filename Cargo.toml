[workspace]
members = ["crates/flashpdf-core", "crates/flashpdf-wasm", "crates/flashpdf-napi"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Cold crate: size over speed, measured no slower warm render.
[profile.release.package.pdf-writer]
opt-level = "z"
