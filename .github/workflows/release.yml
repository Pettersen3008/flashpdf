name: Release

on:
  # A main push whose CI passed releases when its package version is not on npm yet (see check).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - id: version
        run: |
          version=$(node -p 'require("./packages/flashpdf/package.json").version')
          test "$(npm view "@pettersen3008/flashpdf@$version" version 2>/dev/null)" != "$version" || exit 0
          awk -v version="$version" '$1 == "##" && $2 == version { found = 1 } END { exit !found }' packages/flashpdf/CHANGELOG.md \
            || { echo "packages/flashpdf/CHANGELOG.md has no '## $version' heading" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One N-API addon per platform, packed as napi-rs lays them out. Other platforms use WASM.
  native:
    needs: check
    if: needs.check.outputs.version != ''
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15, cross: true }
          # The oldest supported Ubuntu sets the glibc floor; an older glibc falls back to WASM.
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable 2026-09-16
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      # No caches here: a poisoned one would ship inside the published addon.
      - run: sh build-native.sh
        env:
          TARGET: ${{ matrix.target }}
      - if: ${{ !matrix.cross }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: packages/flashpdf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - if: ${{ !matrix.cross }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Proves this platform's addon renders byte for byte what the WASM fallback renders.
      - if: ${{ !matrix.cross }}
        run: node tests/e2e.mjs --node-only
      - run: |
          mkdir -p "$RUNNER_TEMP/native"
          npm pack packages/flashpdf/npm/* --pack-destination "$RUNNER_TEMP/native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.target }}
          path: ${{ runner.temp }}/native/*.tgz
          if-no-files-found: error
          retention-days: 7

  # Holds the write permissions, and runs only GitHub's own actions, npm, and gh.
  publish:
    needs: [check, native]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: packages/flashpdf
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-*
          merge-multiple: true
          path: ${{ runner.temp }}/native
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # npm installs the platform package matching os, cpu, and libc.
      - id: pack
        working-directory: packages/flashpdf
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            npm pkg set "optionalDependencies.@pettersen3008/flashpdf-${platform}=${VERSION}"
          done
          echo "tarball=$RUNNER_TEMP/$(npm pack --pack-destination "$RUNNER_TEMP" --silent | tail -n 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ runner.temp }}/native/*.tgz
      # Platform packages first, so the main package never points at a missing version.
      # npm prefers OIDC trusted publishing; NPM_TOKEN only bootstraps packages that do not exist yet.
      - run: |
          for tarball in "$RUNNER_TEMP"/native/*.tgz; do npm publish "$tarball" --access public --provenance; done
          npm publish "$TARBALL" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
      - run: |
          awk -v version="$VERSION" '$1 == "##" { if (found) exit; found = $2 == version; next } found' packages/flashpdf/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "v$VERSION" --target "$SHA" --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
