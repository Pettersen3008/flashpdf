version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    ignore:
      # 0.9.0 stays within the WASM budget; 0.10+ adds about 1.38 MB.
      - dependency-name: harfrust
      # pdf.rs rewrites 0.15.0's xref table, and a test pins that format.
      - dependency-name: pdf-writer
      # Keep PDF integer formatting on the tested 1.0.18 implementation.
      - dependency-name: itoa
      # Fix the math implementation for byte-identical native and WASM output.
      - dependency-name: libm
      # Keep compressed PDF bytes on the tested 0.9.1 deflater.
      - dependency-name: miniz_oxide
      # Share harfrust 0.9.0's font parser instead of adding another version.
      - dependency-name: read-fonts
      # Keep native parallel execution on the tested 1.12.0 release.
      - dependency-name: rayon
      # Keep bidi ordering and Unicode data on the tested 0.3.18 release.
      - dependency-name: unicode-bidi
      # Keep Unicode line-break opportunities on the tested 0.1.5 release.
      - dependency-name: unicode-linebreak
      # Keep the native runtime on the version tested with napi-derive.
      - dependency-name: napi
      # Keep generated native bindings on the version tested with napi.
      - dependency-name: napi-derive
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
