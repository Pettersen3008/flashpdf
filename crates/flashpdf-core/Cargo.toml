[package]
name = "flashpdf-core"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
itoa = "=1.0.18"
libm = { version = "=0.2.16", default-features = false }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
harfrust = { version = "=0.9.0", default-features = false, features = ["std"] }
# Already in the tree through harfrust; parses the variation tables.
read-fonts = { version = "=0.40.2", default-features = false }
pdf-writer = "=0.15.0"
rayon = { version = "=1.12.0", optional = true }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data", "std"] }
unicode-linebreak = "=0.1.5"

[features]
# Native builds only: spreads independent finish work over threads, same bytes.
parallel = ["dep:rayon"]

[dev-dependencies]
lopdf = { version = "0.46", default-features = false }
